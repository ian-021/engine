# ---------------------------------------------------------------------------
# Session entry
# ---------------------------------------------------------------------------

session:
  date: 2026-09-15
  milestone:
    number: 0
    name: Weights and tokenizer
  hours: X                    # TODO: fill in. Commits span 09:23 to 20:54 with breaks.

  # One or two sentences. What did I sit down intending to finish?
  # Write this BEFORE starting. If the goal changes mid-session, add an entry
  # to goal_changes rather than editing the original.
  goal: "Understand what a tensor is. "
  goal_changes:
    - "Goal changed to: understand what the 56 tensors are, then write export.py (M0 part 1)."

  # You will come back after a week away and not remember which commit
  # worked. This section is the save file.
  state_at_start:
    milestones_done: []
    last_good_commit: ""      # nothing yet, first session
    last_number_that_matters: ""

  # Chronological. Short lines. Include commands you ran and files you
  # touched. This is the section you skim later to reconstruct what happened.
  # Resist the urge to write the cleaned-up version.
  what_i_did:
    - "Copied notes/template.yaml, made day-01/ folder, set up day-01/.venv (py3.11, torch, transformers). Commit 193f0ff."
    - "simple_tensor.py: built a 3x3 tensor, flattened it, view()'d it back. Convinced myself flatten is not a conversion."
    - "list_tensors.py: printed every named_parameter with shape and numel. 56 tensors, 15,191,712 params."
    - "explore.py: pulled out embed_tokens, layer0 q_proj, down_proj, post_attention_layernorm to look at shapes and rows."
    - "Wrote notes/confusions-2026-09-15.md: 19 confusions worked through with a tutor. Commit 18a4566."
    - "Started export.py: load model, read hidden/intermediate/vocab/layers from config. Commit b43effc."
    - "Decided header = 4 little-endian int32 (struct.pack '<4i'), body = every tensor flattened to float32 in a fixed order."
    - "Body order: embed, then per layer q,k,v,o,gate,up,down,input_norm,post_norm, then final norm."
    - "Ran export.py -> day-01/stories15M.bin. Added *bin to .gitignore. Commit 0ef4d5f."
    - "export.py prints embed row 42 first 5 values as the reference for the C-side check."

  QA:
  - question: "What is a tensor?"
    answer: "A 'folder' that stores the data used in the forward pass."
    better_answer: "A box of numbers with a shape written on the lid. 2D = matrix, 1D = list, 0D = one number."

  - question: "What does the model do with the tensors?"
    answer: "Tensors are ingredients. The forward pass is the recipe. HF ships both; I keep their ingredients and rewrite the recipe in C."

  - question: "How does C know the shape if the file is flat?"
    answer: "It doesn't. The header says the dims and the C code hardcodes the order. If they disagree the result is silent garbage."

  # Every measurement, with enough context to reproduce it.
  # Also append each row to results/throughput.csv.
  # A number without a commit hash is unreproducible. A number without
  # seq_len, batch, and dtype is meaningless for this project.
  numbers:
    # M0 has no tokens/sec. The numbers the assignment says to write down:
    m0_facts:
      model: Xenova/llama2.c-stories15M
      tensors: 56
      params: 15191712
      dtype: fp32
      weight_bytes: 60766848          # 15,191,712 * 4
      header_bytes: 16                # 4 x int32
      file_bytes: 60766864            # matches ls -l day-01/stories15M.bin
      largest_tensor: "embed_tokens [32000, 288] = 9,216,000 params, 61% of the model"
      commit: 0ef4d5f
    runs: []
    compare_against_previous:
      before: null
      after: null
      ratio: null
    compare_against_ceiling:
      theoretical: null
      achieved_percent: null

  # One entry per problem. Even the ones you solved in five minutes.
  # "suspected_first" vs "actually_was" is how you learn to suspect the
  # right thing next time.
  bugs_and_dead_ends:
    - title: read a shape as an index
      symptom: "Treated [2,2,3] as a position and (1,0,2) as a size; could not follow the 3D lookup example."
      suspected_first: "That I did not understand 3D tensors."
      actually_was: "Two same-looking triples with different jobs. Shape = how many, index = which one."
      confirmed_fix_by: "Worked position = a*(B*C) + b*C + c by hand and got the right element."
      time_lost: "TODO"
    - title: off by one from 1-based counting
      symptom: "Said row 1, column 2 of [[1,2,3],[4,5,6]] is 2."
      suspected_first: "Nothing, thought the answer was right."
      actually_was: "Zero-based. Row 1 is the second row, so the answer is 6."
      confirmed_fix_by: "Re-did it with emb[42, :5] style indexing."
      time_lost: "~5 min"
    - title: expected lm_head tensor, there is none
      symptom: "Counted 57 tensors on paper, list_tensors.py printed 56."
      suspected_first: "Missing weights in the HF checkpoint."
      actually_was: "tie_word_embeddings is true, so the output projection reuses embed_tokens."
      confirmed_fix_by: "config.tie_word_embeddings == True."
      time_lost: "TODO"

  # The most important section. Plain sentences, as if explaining to someone
  # who has not read the code. If the answer is "nothing new," say that; it
  # means the session was execution, not learning, which is fine but worth
  # noticing. This is the section you will reread before the interview.
  #
  # DRAFT pulled from notes/confusions-2026-09-15.md. Rewrite in your own words.
  understood_today: >-
    A model is just a list of tensors plus a recipe. The tensors are boxes of
    numbers with a shape on the lid; the recipe is the forward pass, which
    reads every box once and turns token ids into 32000 scores. This model
    has 56 boxes, 15.2M numbers total, and the embedding table is 61% of
    them because small models have a big vocab relative to their hidden size.
    Memory and disk are already flat, so "flattening" a matrix for the file
    is a no-op; the shape has to travel separately in the header, and if the
    header and the C reader disagree nothing errors, the weights are just
    wrong. Token ids are integers into the vocab, and embedding lookup is
    row selection, not math. Q/K/V/O/gate/up/down are nine grids per layer
    whose meaning I still have to learn in M1.

  # Things I don't understand yet, or want to test. Each one should be
  # specific enough that a future session could take it as its goal.
  open_questions:
    - "What do Q, K, V actually compute in attention? (M1)"
    - "HF stores Q and K in a permuted layout for its RoPE. Do I un-permute at export, or write my RoPE to match HF? Decide before M1."
    - "The 4-int header has no n_heads, max_seq_len, rms_norm_eps, or rope_theta. Add to header and re-export, or hardcode in C?"
    - "Does embed row 42 read back from C match what export.py printed?"
    - "Predict file size from params before checking ls -l: 16 + 15,191,712*4 = 60,766,864. Verified."

  # One line. What is the first thing I do when I sit down next time?
  # Removes the startup cost of the next sitting.
  next_session: >-
    Write run.c: fread the 16-byte header into a struct of 4 int32, compute
    each tensor's float count from the header, walk the body in export order,
    print the first 5 of embed row 42 and match export.py. Then tokenizer
    round-trip with SentencePiece.

# ---------------------------------------------------------------------------
# Companion files
# ---------------------------------------------------------------------------

companion_files:

  - path: results/throughput.csv
    purpose: One row per benchmark run, appended, never edited.
    header: date,milestone,model,seq_len,batch,dtype,tok_per_sec_median,tok_per_sec_p90,trials,commit,notes
    notes: >-
      bench.py should write these rows itself so you cannot forget. The final
      chart is generated from this file, filtered to one representative row
      per milestone.

  - path: results/ceilings.md
    purpose: >-
      The Milestone 2 arithmetic, kept as a standalone document so you can
      reference it from every later session. One row per (model, dtype) pair.
    columns:
      - model
      - dtype
      - params
      - bytes/token
      - mem BW (GB/s)
      - BW ceiling tok/s
      - FLOPs/token
      - compute ceiling tok/s
      - binding constraint
    notes: >-
      Update it when you quantize (bytes/token changes) and when you batch
      (the compute side changes). Every "achieved vs ceiling" line in a
      session entry points back to a row here.

  - path: notes/BUGLOG.md
    purpose: A running index, one line per bug, linking to the session where it happened.
    example:
      - "2026-09-20  RoPE applied to adjacent pairs instead of halves  ->  notes/2026-09-20.yaml"
      - "2026-09-21  softmax overflow at long sequences  ->  notes/2026-09-21.yaml"
    notes: >-
      You will not remember which day the RoPE bug was. This index is how you
      find it when writing the README.

  - path: notes/QUESTIONS.md
    purpose: >-
      The eight questions from Section 6 of the assignment, each followed by
      your current best answer, dated.
    notes: >-
      Rewrite the answer whenever your understanding changes; keep the old one
      below it struck through. Seeing your own answer improve over five weeks
      is both motivating and a good check that you actually learned something
      rather than just shipped code.

# ---------------------------------------------------------------------------
# A minimal example of the shape (placeholders, not real numbers)
# ---------------------------------------------------------------------------

example_session:
  date: 2026-09-27
  milestone:
    number: 3
    name: KV cache
  hours: 2.5

  goal: >-
    Get decode tok/s flat across seq_len 64/256/1024 with output still
    matching HF greedy.
  goal_changes: []

  state_at_start:
    milestones_done: [M0, M1, M2]
    last_good_commit: a1b2c3d
    last_number_that_matters: "Baseline decode @ seq 256: [N] tok/s fp32 B=1"

  what_i_did:
    - Added kv_cache struct, one buffer per layer, sized [max_seq][kv_heads][head_dim]
    - Changed attention loop to read K/V from cache for pos < current
    - "First run: matched HF for 16 tokens then diverged"
    - Suspected RoPE not applied to cached K; checked, was fine
    - "Actual bug: writing V into cache at index pos+1 (off by one)"
    - Fixed, matched HF for 100 tokens
    - Benchmarked at 64/256/1024

  numbers:
    runs:
      - {what: kv cache, model: smollm-135m, seq_len: 64,   batch: 1, dtype: fp32, tok_per_sec_median: "[N]", trials: 10, commit: e4f5g6h}
      - {what: kv cache, model: smollm-135m, seq_len: 256,  batch: 1, dtype: fp32, tok_per_sec_median: "[N]", trials: 10, commit: e4f5g6h}
      - {what: kv cache, model: smollm-135m, seq_len: 1024, batch: 1, dtype: fp32, tok_per_sec_median: "[N]", trials: 10, commit: e4f5g6h}
    compare_against_previous:
      before: "[N]"
      after: "[N]"
      ratio: "[N]x"
    compare_against_ceiling:
      theoretical: "[N] tok/s (BW, fp32)"
      achieved_percent: "[N]%"

  bugs_and_dead_ends:
    - title: divergence from HF after 16 tokens
      symptom: greedy output matched for 16 tokens, then differed
      suspected_first: RoPE not applied to cached keys
      actually_was: off-by-one writing V to cache
      confirmed_fix_by: 100-token greedy match restored
      time_lost: ~40 min

  understood_today: >-
    [plain-sentence explanation of why the cache changed the curve shape]

  open_questions:
    - >-
      Why is 1024 still slightly slower than 256 if weight reads are constant?
      Attention over the cache is still O(n). How much of the per-token time
      is that now?

  next_session: >-
    Profile one decode step at seq 1024 to split time between matmuls and
    attention-over-cache.
